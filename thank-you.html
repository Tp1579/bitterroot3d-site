<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thank You | Bitterroot 3D</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#22A7C9">
  <link rel="icon" type="image/png" href="logo.png">
  <style>
    :root { --teal: #22A7C9; --charcoal: #2B3036; --gold: #F4C430; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--teal);
      color: var(--charcoal);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 32px 16px; min-height: 100vh;
    }
    main { width: 100%; max-width: 640px; }
    .logo { width: 100%; max-width: 420px; height: auto; display: block; margin: 0 auto 24px; }
    h1 { font-size: clamp(1.5rem, 4vw, 2.25rem); font-weight: 800; letter-spacing: .04em; text-transform: uppercase; margin-bottom: 12px; }
    .rule { width: 64px; height: 6px; border: 0; border-radius: 3px; background: var(--gold); margin: 0 auto 20px; }
    p { font-size: 1.125rem; line-height: 1.6; margin-bottom: 12px; }
    .btn {
      display: inline-block; background: var(--charcoal); color: #fff; text-decoration: none;
      font-weight: 700; padding: 14px 28px; border-radius: 999px; letter-spacing: .03em; margin-top: 16px;
    }
    .btn:hover { background: #000; }
    .btn:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="logo.png" width="1207" height="863"
         alt="Bitterroot 3D Creations logo: mountains and a bitterroot flower above the words Bitterroot 3D Creations, Montana Rooted.">
    <h1>Thank You!</h1>
    <hr class="rule" aria-hidden="true">
    <p>We got your custom pet 3D print request and photos. We will be in touch soon.</p>
    <a class="btn" href="index.html">Back to Bitterroot 3D</a>
  </main>
</body>
</html>
